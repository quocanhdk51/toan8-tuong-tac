<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Định lí Thalès – tương tác</title>
<style>
  :root { --navy:#1F3A5F; --teal:#12867A; --gold:#E9A23B; --coral:#D9573B; --bg:#E3F4F1; --ink:#1B2333; --muted:#4A5568; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; }
  header h1 { margin: 0; font: 700 30px Cambria, Georgia, serif; color: var(--navy); flex: 1; }
  .tag { background: var(--teal); color: #fff; font-weight: 700; border-radius: 999px; padding: 6px 16px; font-size: 16px; letter-spacing: .05em; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 0 24px 20px; min-height: 0; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 4px 16px rgba(27,35,51,.12); }
  #stage { width: 100%; height: 100%; touch-action: none; display: block; }
  .left { position: relative; min-height: 0; }
  .hint { position: absolute; left: 18px; bottom: 12px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .right { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .controls { padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, label.tg { font: 700 18px "Segoe UI", Arial, sans-serif; border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; background: #EEF3F8; color: var(--navy); }
  button:hover { background: #dde7f2; }
  button.on { background: var(--teal); color: #fff; }
  label.tg { display: inline-flex; gap: 8px; align-items: center; }
  label.tg input { width: 22px; height: 22px; }
  .ratios { padding: 14px 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .pair { display: flex; align-items: center; gap: 14px; font: 700 30px Cambria, Georgia, serif; color: var(--navy); }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .frac .n { border-bottom: 3px solid currentColor; padding: 0 6px; }
  .frac .d { padding: 0 6px; }
  .val { font: 700 24px "Segoe UI", Arial, sans-serif; color: var(--muted); min-width: 70px; text-align: center; }
  .rel { font: 800 34px "Segoe UI", Arial, sans-serif; width: 44px; text-align: center; }
  .rel.eq { color: var(--teal); } .rel.ne { color: var(--coral); }
  .lens { padding: 12px 18px; font: 600 19px "Segoe UI", Arial, sans-serif; color: var(--ink); display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 14px; }
  .lens b { color: var(--navy); }
  .note { padding: 12px 18px; font: 700 19px "Segoe UI", Arial, sans-serif; }
  .note.ok { color: var(--teal); } .note.bad { color: var(--coral); }
  .hidden { visibility: hidden; }
  svg text { font: 700 26px Cambria, Georgia, serif; fill: var(--navy); user-select: none; }
  .handle { cursor: grab; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } .left { height: 62vh; } header h1 { font-size: 22px; } .pair { font-size: 24px; } .lens { font-size: 16px; } }
</style>
</head>
<body>
<header>
  <span class="tag">TIẾT 18 · HÌNH THÀNH KIẾN THỨC</span>
  <h1>Định lí Thalès – kéo điểm, quan sát tỉ số</h1>
  <button id="fs">Toàn màn hình</button>
</header>
<main>
  <div class="card left">
    <svg id="stage" viewBox="0 0 760 600"></svg>
    <div class="hint">Kéo các điểm A, B, C, B′ (và C′ khi bỏ song song)</div>
  </div>
  <div class="right">
    <div class="card controls">
      <button data-pos="1">Vị trí 1</button><button data-pos="2">Vị trí 2</button><button data-pos="3">Vị trí 3</button>
      <label class="tg"><input type="checkbox" id="par" checked> Giữ B′C′ // BC</label>
      <label class="tg"><input type="checkbox" id="showLen" checked> Số đo</label>
      <label class="tg"><input type="checkbox" id="showRat" checked> Tỉ số</label>
    </div>
    <div class="card lens" id="lens"></div>
    <div class="card ratios" id="ratios"></div>
    <div class="card note" id="note"></div>
  </div>
</main>
<script>
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('stage');
const PX = 60; // px per cm
let A = {x: 330, y: 70}, B, C, t = 1/3, u = 1/3;
function preset() {
  const r = d => d * Math.PI / 180;
  B = {x: A.x + 6*PX*Math.cos(r(115)), y: A.y + 6*PX*Math.sin(r(115))};
  C = {x: A.x + 9*PX*Math.cos(r(60)), y: A.y + 9*PX*Math.sin(r(60))};
}
preset();
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const fill = el('polygon', {fill: 'rgba(18,134,122,.18)'});
const sAB = el('line', {stroke: '#1F3A5F', 'stroke-width': 4}), sAC = el('line', {stroke: '#1F3A5F', 'stroke-width': 4});
const sBC = el('line', {stroke: '#E9A23B', 'stroke-width': 6}), sB1C1 = el('line', {stroke: '#E9A23B', 'stroke-width': 6});
const marks = el('g', {});
const handles = {}, labels = {};
for (const k of ['A', 'B', 'C', 'B1', 'C1']) {
  handles[k] = el('circle', {r: 11, fill: k.length > 1 ? '#D9573B' : '#1F3A5F', class: 'handle', stroke: '#fff', 'stroke-width': 3});
  labels[k] = el('text', {'text-anchor': 'middle'});
  labels[k].textContent = k === 'B1' ? 'B′' : k === 'C1' ? 'C′' : k;
}
const lerp = (P, Q, s) => ({x: P.x + (Q.x - P.x) * s, y: P.y + (Q.y - P.y) * s});
const dist = (P, Q) => Math.hypot(P.x - Q.x, P.y - Q.y);
const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
function arrowMark(P, Q) { // small chevron at midpoint showing direction (parallel mark)
  const m = lerp(P, Q, .5), d = Math.hypot(Q.x - P.x, Q.y - P.y), ux = (Q.x - P.x) / d, uy = (Q.y - P.y) / d;
  const s = 12, a = {x: m.x - ux*s - uy*s*.7, y: m.y - uy*s + ux*s*.7}, b = {x: m.x - ux*s + uy*s*.7, y: m.y - uy*s - ux*s*.7};
  el('polyline', {points: `${a.x},${a.y} ${m.x},${m.y} ${b.x},${b.y}`, fill: 'none', stroke: '#1F3A5F', 'stroke-width': 3}, marks);
}
const frac = (n, d) => `<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
function draw() {
  const par = document.getElementById('par').checked;
  if (par) u = t;
  const B1 = lerp(A, B, t), C1 = lerp(A, C, u);
  set(fill, {points: `${A.x},${A.y} ${B1.x},${B1.y} ${C1.x},${C1.y}`});
  set(sAB, {x1: A.x, y1: A.y, x2: B.x, y2: B.y}); set(sAC, {x1: A.x, y1: A.y, x2: C.x, y2: C.y});
  set(sBC, {x1: B.x, y1: B.y, x2: C.x, y2: C.y}); set(sB1C1, {x1: B1.x, y1: B1.y, x2: C1.x, y2: C1.y, stroke: par ? '#E9A23B' : '#9AA7B8'});
  marks.innerHTML = '';
  if (par) { arrowMark(B, C); arrowMark(B1, C1); }
  const P = {A, B, C, B1, C1}, off = {A: [0, -20], B: [-24, 30], C: [24, 30], B1: [-30, 6], C1: [32, 6]};
  for (const k in P) { set(handles[k], {cx: P[k].x, cy: P[k].y}); set(labels[k], {x: P[k].x + off[k][0], y: P[k].y + off[k][1]}); }
  handles.C1.style.display = par ? 'none' : '';
  // lengths in cm
  const AB = dist(A, B) / PX, AC = dist(A, C) / PX, AB1 = t * AB, B1B = AB - AB1, AC1 = u * AC, C1C = AC - AC1;
  const f1 = n => n.toFixed(1).replace('.', ',');
  document.getElementById('lens').innerHTML = `<div>AB = <b>${f1(AB)}</b> cm</div><div>AB′ = <b>${f1(AB1)}</b> cm</div><div>B′B = <b>${f1(B1B)}</b> cm</div><div>AC = <b>${f1(AC)}</b> cm</div><div>AC′ = <b>${f1(AC1)}</b> cm</div><div>C′C = <b>${f1(C1C)}</b> cm</div>`;
  const rows = [[frac('AB′', 'AB'), AB1 / AB, frac('AC′', 'AC'), AC1 / AC], [frac('AB′', 'B′B'), AB1 / B1B, frac('AC′', 'C′C'), AC1 / C1C], [frac('B′B', 'AB'), B1B / AB, frac('C′C', 'AC'), C1C / AC]];
  const f2 = n => n.toFixed(2).replace('.', ',');
  let allEq = true;
  document.getElementById('ratios').innerHTML = rows.map(([l, lv, r, rv]) => {
    const eq = Math.abs(lv - rv) < 0.005 * Math.max(1, lv); allEq = allEq && eq;
    return `<div class="pair">${l}<span class="val">≈ ${f2(lv)}</span><span class="rel ${eq ? 'eq' : 'ne'}">${eq ? '=' : '≠'}</span>${r}<span class="val">≈ ${f2(rv)}</span></div>`;
  }).join('');
  const note = document.getElementById('note');
  note.className = 'card note ' + (allEq ? 'ok' : 'bad');
  note.textContent = allEq ? 'B′C′ // BC: giá trị tỉ số có thể đổi, nhưng từng cặp tỉ số luôn bằng nhau.' : 'B′C′ không song song với BC: các cặp tỉ số không còn bằng nhau.';
  document.getElementById('lens').classList.toggle('hidden', !document.getElementById('showLen').checked);
  document.getElementById('ratios').classList.toggle('hidden', !document.getElementById('showRat').checked);
}
// dragging
let drag = null;
function pt(ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function proj(P, Q, M) { const dx = Q.x - P.x, dy = Q.y - P.y; let s = ((M.x - P.x) * dx + (M.y - P.y) * dy) / (dx * dx + dy * dy); return Math.min(.92, Math.max(.08, s)); }
for (const k in handles) handles[k].addEventListener('pointerdown', ev => { drag = k; svg.setPointerCapture(ev.pointerId); });
svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  const m = pt(ev), c = {x: Math.min(740, Math.max(20, m.x)), y: Math.min(580, Math.max(20, m.y))};
  if (drag === 'A') A = c; else if (drag === 'B') B = c; else if (drag === 'C') C = c;
  else if (drag === 'B1') t = proj(A, B, m); else if (drag === 'C1') u = proj(A, C, m);
  document.querySelectorAll('[data-pos]').forEach(b => b.classList.remove('on'));
  draw();
});
svg.addEventListener('pointerup', () => drag = null);
document.querySelectorAll('[data-pos]').forEach(b => b.addEventListener('click', () => {
  A = {x: 330, y: 70}; preset(); t = u = [1/3, 1/2, 2/3][b.dataset.pos - 1];
  document.getElementById('par').checked = true;
  document.querySelectorAll('[data-pos]').forEach(x => x.classList.toggle('on', x === b)); draw();
}));
['par', 'showLen', 'showRat'].forEach(id => document.getElementById(id).addEventListener('change', draw));
document.getElementById('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
document.querySelector('[data-pos="1"]').classList.add('on');
draw();
</script>
</body>
</html>
